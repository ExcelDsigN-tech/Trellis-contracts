[[exceptions]]

id = "clippy::unwrap_used"
path = "contracts/governance-contract/src/lib.rs"
severity = "high"
rationale = """
Pre-existing. admin_set.get(i).unwrap() inside `while i < admin_set.len()`;
the index is always in bounds, so the panic branch is unreachable.
"""
expires = "2026-12-31"


[[exceptions]]

id = "clippy::unwrap_used"
path = "contracts/aid-contract/src/lib.rs"
severity = "high"
rationale = """
Pre-existing. ids.get(index).unwrap() inside `while index < total` where
total = ids.len(); the index is always in bounds. The function is currently
#[allow(dead_code)].
"""
expires = "2026-12-31"
