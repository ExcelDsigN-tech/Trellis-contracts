name: Security Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            target
          key: security-audit-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install advisory scanner
        run: cargo install cargo-audit --locked

      - name: Run security audit (fails on ungated high-severity findings)
        run: ./scripts/security/run-audit.sh --report security/reports/latest.md --skip-wasm
